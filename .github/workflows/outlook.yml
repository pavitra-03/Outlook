name: Generate Message Trace Logs

on:
  schedule:
    # Runs every 6 hours (at minute 0 of hour 0, 6, 12, 18 UTC)
    - cron: '0 */6 * * *'

  # Allows manual triggers from the Actions tab
  workflow_dispatch:
    inputs:
      message_count:
        description: 'Number of test messages to send'
        required: false
        default: '30'

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute log generator script
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_MAILBOX: ${{ secrets.MS_MAILBOX }}
          # Pass optional recipient secret if defined, otherwise empty
          MS_RECIPIENT: ${{ secrets.MS_RECIPIENT }}
        run: |
          COUNT="${{ github.event.inputs.message_count || '30' }}"
          python outlook.py $COUNT
